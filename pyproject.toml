[project]
name = "fudan-pager-check"
version = "0.1.0"
description = "Paper pre-check agent system"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx[socks]>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "arq>=0.26",
    "redis>=5.0",
    "eval_type_backport>=0.2",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
namespaces = false

[tool.setuptools.package-dir]
"" = "packages"
"worker" = "apps/worker"
"api" = "apps/api"
