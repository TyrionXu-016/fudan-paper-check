services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --app-dir apps
    volumes:
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SECRET: dev-compose-secret
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    command: arq worker.tasks.WorkerSettings
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/apps
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: redis://redis:6379
      PDF_CONVERTER_MODE: docker
      MAKER_IMAGE: ${MAKER_IMAGE:-fudan-pager-mse-maker}
      MINERU_IMAGE: ${MINERU_IMAGE:-}
    depends_on:
      - redis

  web:
    image: node:20-alpine
    working_dir: /app/apps/web-next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - .:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
