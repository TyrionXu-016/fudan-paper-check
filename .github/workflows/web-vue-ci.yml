name: web-vue-ci

on:
  push:
    paths:
      - 'apps/web-vue/**'
      - '.github/workflows/web-vue-ci.yml'
  pull_request:
    paths:
      - 'apps/web-vue/**'
      - '.github/workflows/web-vue-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run perf:budget

