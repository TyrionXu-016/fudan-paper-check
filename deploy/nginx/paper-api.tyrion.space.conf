# paper-api.tyrion.space - paper check backend API (HTTPS)
# Certificate: certbot certonly --nginx -d paper-api.tyrion.space
# Or run: ./deploy/setup-https.sh

server {
    listen 80;
    server_name paper-api.tyrion.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name paper-api.tyrion.space;

    ssl_certificate /etc/letsencrypt/live/paper-api.tyrion.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper-api.tyrion.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
