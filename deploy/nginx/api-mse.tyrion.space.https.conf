# api-mse.tyrion.space - MSE backend API (HTTPS after DNS is active)

server {
    listen 80;
    server_name api-mse.tyrion.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-mse.tyrion.space;

    ssl_certificate /etc/letsencrypt/live/api-mse.tyrion.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-mse.tyrion.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    access_log /var/log/nginx/api-mse.access.log;
    error_log /var/log/nginx/api-mse.error.log;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
