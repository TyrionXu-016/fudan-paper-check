# 生产环境：后端 API + Worker；Redis 使用外部托管服务
# 用法：在仓库根目录执行
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --no-build

name: fudan-pager-mse

services:
  api:
    image: ${APP_IMAGE}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --app-dir apps
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8000"
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the managed Redis connection string}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MSE_DATABASE_URL: ${MSE_DATABASE_URL:?Set MSE_DATABASE_URL to the Supabase Postgres connection string}
      MSE_DB_SCHEMA: ${MSE_DB_SCHEMA:-fudan_pager}
      MSE_ENABLE_RLS: ${MSE_ENABLE_RLS:-0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PDF_CONVERTER_MODE: ${PDF_CONVERTER_MODE:-docker}
      MSE_ALLOW_MOCK_FALLBACK: ${MSE_ALLOW_MOCK_FALLBACK:-0}
      MINERU_IMAGE: ${MINERU_IMAGE:-fudan-pager-mse-mineru}
      MAKER_IMAGE: ${MAKER_IMAGE:-fudan-pager-mse-maker}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_METHOD: ${MINERU_METHOD:-auto}
      MINERU_MAX_RETRIES: ${MINERU_MAX_RETRIES:-2}
      MAKER_TIMEOUT_SECONDS: ${MAKER_TIMEOUT_SECONDS:-300}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-1800}
      MINERU_CACHE_VOLUME: ${MINERU_CACHE_VOLUME:-fudan-pager-mse-mineru-cache}
      MINERU_CACHE_DIR: ${MINERU_CACHE_DIR:-}
      MINERU_START_PAGE: ${MINERU_START_PAGE:-}
      MINERU_END_PAGE: ${MINERU_END_PAGE:-}
      MINERU_PDF_RENDER_THREADS: ${MINERU_PDF_RENDER_THREADS:-}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-}
      MINERU_TABLE_MERGE_ENABLE: ${MINERU_TABLE_MERGE_ENABLE:-}
      MINERU_DOCKER_SHM_SIZE: ${MINERU_DOCKER_SHM_SIZE:-}
      DOCKER_CONTAINER_DATA_ROOT: ${DOCKER_CONTAINER_DATA_ROOT:-/app/data}
      DOCKER_HOST_DATA_ROOT: ${DOCKER_HOST_DATA_ROOT:-}
      NOTIFIER: ${NOTIFIER:-console}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-deepseek-reasoner}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-90}
      MSE_INVITE_SECRET: ${MSE_INVITE_SECRET:-}
      MSE_INVITE_TTL_DAYS: ${MSE_INVITE_TTL_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-}
      WEBHOOK_KIND: ${WEBHOOK_KIND:-feishu}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-15}
      MSE_REVISION_DUE_DAYS: ${MSE_REVISION_DUE_DAYS:-7}
      MSE_REVISION_REMINDER_WINDOW_HOURS: ${MSE_REVISION_REMINDER_WINDOW_HOURS:-24}
      MSE_REVISION_REMINDER_DRY_RUN: ${MSE_REVISION_REMINDER_DRY_RUN:-0}
    volumes:
      - pager_data:/app/data
    networks:
      - pager_internal

  worker:
    image: ${APP_IMAGE}
    command: arq worker.tasks.WorkerSettings
    working_dir: /app/apps
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the managed Redis connection string}
      MSE_DATABASE_URL: ${MSE_DATABASE_URL:?Set MSE_DATABASE_URL to the Supabase Postgres connection string}
      MSE_DB_SCHEMA: ${MSE_DB_SCHEMA:-fudan_pager}
      MSE_ENABLE_RLS: ${MSE_ENABLE_RLS:-0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PDF_CONVERTER_MODE: ${PDF_CONVERTER_MODE:-docker}
      MSE_ALLOW_MOCK_FALLBACK: ${MSE_ALLOW_MOCK_FALLBACK:-0}
      MINERU_IMAGE: ${MINERU_IMAGE:-fudan-pager-mse-mineru}
      MAKER_IMAGE: ${MAKER_IMAGE:-fudan-pager-mse-maker}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_METHOD: ${MINERU_METHOD:-auto}
      MINERU_MAX_RETRIES: ${MINERU_MAX_RETRIES:-2}
      MAKER_TIMEOUT_SECONDS: ${MAKER_TIMEOUT_SECONDS:-300}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-1800}
      MINERU_CACHE_VOLUME: ${MINERU_CACHE_VOLUME:-fudan-pager-mse-mineru-cache}
      MINERU_CACHE_DIR: ${MINERU_CACHE_DIR:-}
      MINERU_START_PAGE: ${MINERU_START_PAGE:-}
      MINERU_END_PAGE: ${MINERU_END_PAGE:-}
      MINERU_PDF_RENDER_THREADS: ${MINERU_PDF_RENDER_THREADS:-}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-}
      MINERU_TABLE_MERGE_ENABLE: ${MINERU_TABLE_MERGE_ENABLE:-}
      MINERU_DOCKER_SHM_SIZE: ${MINERU_DOCKER_SHM_SIZE:-}
      DOCKER_CONTAINER_DATA_ROOT: ${DOCKER_CONTAINER_DATA_ROOT:-/app/data}
      DOCKER_HOST_DATA_ROOT: ${DOCKER_HOST_DATA_ROOT:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-deepseek-reasoner}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-90}
      NOTIFIER: ${NOTIFIER:-console}
      MSE_INVITE_SECRET: ${MSE_INVITE_SECRET:-}
      MSE_INVITE_TTL_DAYS: ${MSE_INVITE_TTL_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-}
      WEBHOOK_KIND: ${WEBHOOK_KIND:-feishu}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-15}
      MSE_REVISION_DUE_DAYS: ${MSE_REVISION_DUE_DAYS:-7}
      MSE_REVISION_REMINDER_WINDOW_HOURS: ${MSE_REVISION_REMINDER_WINDOW_HOURS:-24}
      MSE_REVISION_REMINDER_DRY_RUN: ${MSE_REVISION_REMINDER_DRY_RUN:-0}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-2400}
    volumes:
      - pager_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - pager_internal

volumes:
  pager_data:

networks:
  pager_internal:
    driver: bridge
