# 生产环境：仅后端 API + Redis + Worker
# 用法：在仓库根目录执行
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - pager_internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --app-dir apps
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8000"
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set a comma-separated list of trusted frontend origins}
      PDF_CONVERTER_MODE: ${PDF_CONVERTER_MODE:-mock}
    volumes:
      - pager_data:/app/data
    depends_on:
      - redis
    networks:
      - pager_internal

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: arq worker.tasks.WorkerSettings
    working_dir: /app/apps
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/packages:/app/apps
      REDIS_URL: redis://redis:6379
      PDF_CONVERTER_MODE: ${PDF_CONVERTER_MODE:-mock}
    volumes:
      - pager_data:/app/data
    depends_on:
      - redis
    networks:
      - pager_internal

volumes:
  pager_data:

networks:
  pager_internal:
    driver: bridge
